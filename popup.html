<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --panel:#f5f6f7; --line:#e8eaed; --fg:#111; --muted:#6b7280; --accent:#178a4d; --hide:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181b; --panel:#1f2226; --line:#2a2e33; --fg:#ececec; --muted:#9a9fa6; --accent:#4fbf84; --hide:#e0706a; } }
  * { box-sizing: border-box; }
  body { width: 296px; margin: 0; padding: 14px 16px 12px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "PingFang SC", sans-serif; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  h1 img { width: 18px; height: 18px; vertical-align: -4px; margin-right: 7px; }
  .switch { position: relative; width: 36px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--line); border-radius: 999px; cursor: pointer; transition: .15s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(14px); }
  .muted { color: var(--muted); font-size: 11.5px; }
  .label { font-size: 11.5px; color: var(--muted); margin: 0 0 6px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--panel); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 0; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: .12s; }
  .seg button:hover { color: var(--fg); }
  .seg button.active { background: var(--bg); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  .seg.small button { padding: 4px 0; font-size: 11.5px; }
  .desc { min-height: 17px; margin: 7px 0 0; color: var(--muted); font-size: 11.5px; }

  .block { margin-top: 14px; }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 11.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "›"; font-size: 14px; transition: transform .15s; }
  details[open] summary::after { transform: rotate(90deg); }
  .cat { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 6px 0; }
  .cat .n { font-weight: 500; font-size: 12.5px; }
  .cat .cnt { color: var(--muted); font-size: 11px; min-width: 14px; text-align: right; font-variant-numeric: tabular-nums; }
  .cat .seg { padding: 2px; border-radius: 7px; }
  .cat .seg button { padding: 2px 9px; font-size: 11px; border-radius: 5px; }
  .cat .seg button.active.hide { color: var(--hide); }
  .cat .seg button.active.show { color: var(--accent); }
  .sep { border-top: 1px dashed var(--line); margin: 4px 0; }

  .rowbtn { display: flex; gap: 6px; margin-top: 14px; }
  .rowbtn button { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 7px 0; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .rowbtn button:hover { background: var(--panel); }
  a { color: var(--muted); text-decoration: none; font-size: 11.5px; }
  a:hover { color: var(--fg); }
  .warn { background: #fff4e5; color: #8a5a00; padding: 8px 10px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; display: none; }
  .warn a { color: inherit; text-decoration: underline; font-size: inherit; }
  #paused { display: none; margin: -6px 0 10px; }
  .foot { display: flex; justify-content: space-between; margin-top: 12px; align-items: center; }
</style>
</head>
<body>
<h1><span><img src="icons/icon128.png" alt=""><span data-i18n="extensionName">Sift</span></span>
  <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
</h1>
<div class="warn" id="warn"><span data-i18n="popupNotConnected">Not connected yet — </span><a href="#" id="setup" data-i18n="popupSetupLink">set up in 1 minute</a><span data-i18n="period">.</span></div>
<div class="muted" id="paused"><span data-i18n="popupPaused">Paused · </span><a href="#" id="resume" data-i18n="popupResumeNow">resume now</a></div>

<div class="label" data-i18n="popupShowMe">Show me</div>
<div class="seg" id="preset"></div>
<div class="desc" id="presetDesc"></div>

<div class="block">
  <div class="label" data-i18n="popupTechStrictness">How strictly "tech"</div>
  <div class="seg small" id="strict"></div>
</div>

<details>
  <summary><span data-i18n="popupCustomizeLabels">Customize labels</span></summary>
  <div id="cats"></div>
</details>

<div class="rowbtn">
  <button id="showAll" data-i18n="popupShowHidden">Show hidden here</button>
  <button id="pause" data-i18n="popupPauseOneHour">Pause 1 h</button>
</div>

<div class="foot">
  <a href="#" id="openOpts" data-i18n="popupAllSettings">All settings</a>
  <span class="muted" id="spent"></span>
</div>
<script src="i18n.js"></script>
<script src="defaults.js"></script>
<script src="popup.js"></script>
</body>
</html>
